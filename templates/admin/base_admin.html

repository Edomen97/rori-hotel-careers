{% extends "base.html" %}

{% block extra_css %}
<link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet" />
<style>
    .admin-sidebar {
        min-height: calc(100vh - 70px);
        background-color: #0B132B;
    }
    .admin-sidebar .nav-link {
        color: rgba(255, 255, 255, 0.75);
        padding: 0.8rem 1rem;
        border-radius: 8px;
        margin-bottom: 4px;
        transition: all 0.2s ease;
    }
    .admin-sidebar .nav-link:hover,
    .admin-sidebar .nav-link.active {
        color: #C5A059;
        background-color: rgba(197, 160, 89, 0.15);
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- SIDEBAR -->
        <nav class="col-md-2 d-none d-md-block admin-sidebar py-3" id="adminSidebar">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin_dashboard' %}active{% endif %}" href="{{ url_for('admin_dashboard') }}">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin_candidates' or request.endpoint == 'admin_candidate_detail' %}active{% endif %}" href="{{ url_for('admin_candidates') }}">
                        <i class="bi bi-people me-2"></i> Candidates
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin_jobs' %}active{% endif %}" href="{{ url_for('admin_jobs') }}">
                        <i class="bi bi-briefcase me-2"></i> Jobs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin_interviews' %}active{% endif %}" href="{{ url_for('admin_interviews') }}">
                        <i class="bi bi-calendar-event me-2"></i> Interviews
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin_talent_pool' %}active{% endif %}" href="{{ url_for('admin_talent_pool') }}">
                        <i class="bi bi-person-plus me-2"></i> Talent Pool
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin_audit_log' %}active{% endif %}" href="{{ url_for('admin_audit_log') }}">
                        <i class="bi bi-clock-history me-2"></i> Audit Log
                    </a>
                </li>

                <hr class="text-white-50 my-3">

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin_change_password' %}active{% endif %}" href="{{ url_for('admin_change_password') }}">
                        <i class="bi bi-key me-2"></i> Change Password
                    </a>
                </li>
                <li class="nav-item mt-2">
                    <a class="nav-link text-danger" href="{{ url_for('admin_logout') }}">
                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                    </a>
                </li>
            </ul>
        </nav>

        <!-- MAIN CONTENT AREA -->
        <main class="col-md-10 ms-sm-auto px-md-4 admin-main py-4">
            {% block admin_content %}{% endblock %}
        </main>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const sidebarToggler = document.createElement('button');
        sidebarToggler.className = 'btn btn-gold d-md-none mb-3';
        sidebarToggler.innerHTML = '<i class="bi bi-list me-1"></i> Admin Menu';
        sidebarToggler.addEventListener('click', function() {
            const sidebar = document.getElementById('adminSidebar');
            if (sidebar) {
                sidebar.classList.toggle('d-none');
            }
        });
        const main = document.querySelector('.admin-main');
        if (main) {
            main.parentNode.insertBefore(sidebarToggler, main);
        }
    });
</script>
{% endblock %}
