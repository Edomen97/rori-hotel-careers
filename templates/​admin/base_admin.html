{% extends "base.html" %}
{% block extra_css %}<link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet" />{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-md-block bg-navy admin-sidebar" id="adminSidebar">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_dashboard') }}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_candidates') }}"><i class="bi bi-people me-2"></i> Candidates</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_jobs') }}"><i class="bi bi-briefcase me-2"></i> Jobs</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_interviews') }}"><i class="bi bi-calendar-event me-2"></i> Interviews</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_talent_pool') }}"><i class="bi bi-person-plus me-2"></i> Talent Pool</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_reports') }}"><i class="bi bi-graph-up me-2"></i> Reports</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_notifications') }}"><i class="bi bi-bell me-2"></i> Notifications</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_audit_log') }}"><i class="bi bi-clock-history me-2"></i> Audit Log</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_settings') }}"><i class="bi bi-gear me-2"></i> Settings</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="{{ url_for('admin_logout') }}"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
            </ul>
        </nav>
        <main class="col-md-10 ms-sm-auto px-md-4 admin-main">
            {% block admin_content %}{% endblock %}
        </main>
    </div>
</div>
<script>
    // Toggle sidebar on mobile
    document.addEventListener('DOMContentLoaded', function() {
        const sidebarToggler = document.createElement('button');
        sidebarToggler.className = 'btn btn-gold d-md-none mb-3';
        sidebarToggler.innerHTML = '<i class="bi bi-list"></i> Toggle Menu';
        sidebarToggler.addEventListener('click', function() {
            document.getElementById('adminSidebar').classList.toggle('d-none');
        });
        const main = document.querySelector('.admin-main');
        if (main) {
            main.parentNode.insertBefore(sidebarToggler, main);
        }
    });
</script>
{% endblock %}
